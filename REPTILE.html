<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawling Reptile</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50; /* Dark blue background */
            cursor: none; /* Hide the default cursor */
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #14a3c7;
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            background-color: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="info">Move your cursor to see the reptile follow!</div>
    <canvas id="reptileCanvas"></canvas>

    <script>
        const canvas = document.getElementById('reptileCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Mouse position
        const mouse = {
            x: canvas.width / 2,
            y: canvas.height / 2
        };

        // Reptile properties
        const reptileSegments = 20; // Number of body segments
        const segmentSize = 10;     // Radius of each segment
        const reptile = [];         // Array to store segment positions

        // Initialize reptile segments
        for (let i = 0; i < reptileSegments; i++) {
            reptile.push({
                x: canvas.width ,
                y: canvas.height
            });
        }

        // --- Event Listeners ---

        // Track mouse movement
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Handle window resizing
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- Animation Logic ---

        function animate() {
            // Update reptile segments
            updateReptile();

            // Draw the scene
            draw();

            // Request the next frame
            requestAnimationFrame(animate);
        }

        function updateReptile() {
            // Move the head towards the mouse
            let head = reptile[0];
            const dx = mouse.x - head.x;
            const dy = mouse.y - head.y;
            const angle = Math.atan2(dy, dx);
            const speed = 0.05;

            head.x += (mouse.x - head.x) * speed;
            head.y += (mouse.y - head.y) * speed;

            // Move the rest of the body segments
            for (let i = 1; i < reptileSegments; i++) {
                const prevSegment = reptile[i - 1];
                const currentSegment = reptile[i];

                const segmentDx = prevSegment.x - currentSegment.x;
                const segmentDy = prevSegment.y - currentSegment.y;
                const distance = Math.sqrt(segmentDx * segmentDx + segmentDy * segmentDy);

                // Keep a minimum distance between segments
                const minDistance = segmentSize * 0.8;
                if (distance > minDistance) {
                    currentSegment.x += (prevSegment.x - currentSegment.x) * 0.5;
                    currentSegment.y += (prevSegment.y - currentSegment.y) * 0.5;
                }
            }
        }

        function draw() {
            // Clear the canvas with a slight transparent effect for motion blur
            ctx.fillStyle = 'rgba(44, 62, 80, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw each reptile segment
            reptile.forEach((segment, index) => {
                const size = segmentSize * (1 - index / reptileSegments) + 2;
                
                // Create a gradient for a more "scaly" look
                const gradient = ctx.createRadialGradient(segment.x, segment.y, size / 4, segment.x, segment.y, size);
                gradient.addColorStop(0, '#2ecc71');   // Light green
                gradient.addColorStop(1, '#27ae60');   // Darker green
                
                ctx.beginPath();
                ctx.fillStyle = gradient;
                ctx.arc(segment.x, segment.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Draw eyes on the head
            const head = reptile[0];
            const dx = mouse.x - head.x;
            const dy = mouse.y - head.y;
            const angle = Math.atan2(dy, dx);

            // Eye positions relative to the head and angle
            const eyeOffset = segmentSize * 0.5;
            const eye1X = head.x + Math.cos(angle + Math.PI / 4) * eyeOffset;
            const eye1Y = head.y + Math.sin(angle + Math.PI / 4) * eyeOffset;
            const eye2X = head.x + Math.cos(angle - Math.PI / 4) * eyeOffset;
            const eye2Y = head.y + Math.sin(angle - Math.PI / 4) * eyeOffset;
            
            const eyeSize = 3;
            const pupilSize = 1.5;

            // Right eye
            ctx.beginPath();
            ctx.fillStyle = '#fff';
            ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            ctx.beginPath();
            ctx.fillStyle = '#000';
            ctx.arc(eye1X, eye1Y, pupilSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            
            // Left eye
            ctx.beginPath();
            ctx.fillStyle = '#fff';
            ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            ctx.beginPath();
            ctx.fillStyle = '#000';
            ctx.arc(eye2X, eye2Y, pupilSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();

        }

        // Start the animation loop
        animate();
    </script>
</body>
